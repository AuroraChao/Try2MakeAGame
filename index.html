<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓咪撿球實驗遊戲 (Google表單串接版)</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #2c3e50;
            font-family: sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; color: #ecf0f1;
        }
        h1 { margin: 10px 0 5px 0; font-size: 24px; }
        .instructions { margin-bottom: 15px; font-size: 14px; color: #bdc3c7; text-align: center; line-height: 1.5; }
        #gameCanvas { background-color: #ffffff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); display: block; }
        #gameOverOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .modal { background: #34495e; padding: 30px 40px; border-radius: 8px; text-align: center; max-width: 420px; width: 80%; }
        .modal h2 { color: #e74c3c; margin-top: 0; }
        .stats-container { margin: 20px 0; text-align: left; background: #2c3e50; padding: 15px; border-radius: 6px; }
        .stats-item { margin: 10px 0; font-size: 16px; display: flex; justify-content: space-between; }
        .stats-val { font-weight: bold; color: #f1c40f; }
        #statusMessage { margin-top: 15px; font-weight: bold; color: #3498db; font-size: 14px; }
        .btn {
            background-color: #2ecc71; color: white; border: none; padding: 12px 24px;
            font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }
        .container { position: relative; }
    </style>
</head>
<body>

    <h1>貓咪撿球行為實驗</h1>
    <div class="instructions">
        操作方式：鍵盤【方向鍵 ↑ ↓ ← →】移動 | 靠近球後按【空白鍵 Space】撿起/放下球<br>
        將球帶到右上方綠色方形區域放下即可得分！
    </div>

    <div class="container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="gameOverOverlay">
            <div class="modal">
                <h2>遊戲結束！</h2>
                <p>數據分析中，請稍候...</p>
                <div class="stats-container">
                    <div class="stats-item">
                        <span>玩家匿名 ID:</span>
                        <span id="resId" class="stats-val">--</span>
                    </div>
                    <div class="stats-item">
                        <span>總得分 (Total Score):</span>
                        <span id="resScore" class="stats-val">0</span>
                    </div>
                    <div class="stats-item">
                        <span>拿起球的次數 (Pickup Count):</span>
                        <span id="resPickup" class="stats-val">0</span>
                    </div>
                </div>
                
                <div id="statusMessage">📡 正在自動將行為數據同步至中央試算表...</div>
                
                <button class="btn" id="downloadBtn" style="background-color: #7f8c8d;">手動下載 CSV 備份</button>
                <button class="btn" style="background-color: #3498db;" onclick="window.location.reload()">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 📝 請在此處替換成你自己的 Google 表單設定 (將 viewform 改為 formResponse)
        // =========================================================================
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfUPZzbk3dZtAUYfDwNrrzRkTuqezsVFS1SiFJVf0hEW0BYtA/formResponse"; 
        const ENTRY_PLAYER_ID = "entry.2138009385";  // 玩家ID 的欄位代號
        const ENTRY_TOTAL_SCORE = "entry.393998705"; // 總得分 的欄位代號
        const ENTRY_PICKUP_COUNT = "entry.2047045489"; // 拿起次數 的欄位代號
        const ENTRY_TIMELINE = "entry.258162712";    // 詳細行為軌跡 的欄位代號
        // =========================================================================

        // --- 1. 遊戲參數 ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const GAME_DURATION = 60; 
        const BALL_COUNT = 8;     
        const CAT_SPEED = 5;      
        const REACH_DISTANCE = 40;

        const pid = "PLY_" + Math.floor(Math.random() * 89999 + 10000);

        let playerData = {
            totalScore: 0,
            pickupCount: 0,
            gameDuration: GAME_DURATION,
            actions: []
        };

        let timeLeft = GAME_DURATION;
        let isGameOver = false;
        let gameTimer = null;
        let startTime = null;

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };

        // =========================================================================
        // 🖼️ 日後更換自製圖檔的預留區
        // =========================================================================
        const useImages = false; // 💡 未來如果你畫好圖了，把這裡改成 true，並把圖檔跟 html 放一起
        const catImg = new Image(); catImg.src = "cat.png";     // 你的貓咪圖檔名
        const ballImg = new Image(); ballImg.src = "ball.png";   // 你的球體圖檔名
        const bgImg = new Image(); bgImg.src = "background.jpg"; // 你的背景圖檔名

        // --- 2. 物件類別 (Cat & Ball) ---
        class Cat {
            constructor(x, y) { this.x = x; this.y = y; this.radius = 20; this.color = "#e67e22"; this.holdingBall = null; }
            update() {
                if (keys.ArrowUp && this.y > this.radius) this.y -= CAT_SPEED;
                if (keys.ArrowDown && this.y < canvas.height - this.radius) this.y += CAT_SPEED;
                if (keys.ArrowLeft && this.x > this.radius) this.x -= CAT_SPEED;
                if (keys.ArrowRight && this.x < canvas.width - this.radius) this.x += CAT_SPEED;
                if (this.holdingBall) { this.holdingBall.x = this.x; this.holdingBall.y = this.y; }
            }
            draw() {
                ctx.save();
                if (useImages) {
                    // 日後更換自製圖檔的繪製邏輯
                    ctx.drawImage(catImg, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    // 目前的幾何暫代圖案
                    ctx.beginPath(); ctx.moveTo(this.x - 18, this.y - 10); ctx.lineTo(this.x - 18, this.y - 25); ctx.lineTo(this.x - 5, this.y - 15); ctx.fillStyle = this.color; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(this.x + 18, this.y - 10); ctx.lineTo(this.x + 18, this.y - 25); ctx.lineTo(this.x + 5, this.y - 15); ctx.fillStyle = this.color; ctx.fill();
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
                    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(this.x - 6, this.y - 4, 4, 0, Math.PI * 2); ctx.arc(this.x + 6, this.y - 4, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(this.x - 6, this.y - 4, 2, 0, Math.PI * 2); ctx.arc(this.x + 6, this.y - 4, 2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Ball {
            constructor(id, x, y) { this.id = id; this.x = x; this.y = y; this.radius = 12; this.color = "#9b59b6"; this.isHeld = false; }
            draw() {
                ctx.save();
                if (useImages) {
                    ctx.drawImage(ballImg, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
                    ctx.lineWidth = 2; ctx.strokeStyle = "#ffffff"; ctx.stroke();
                }
                ctx.restore();
            }
        }

        // --- 3. 區域座標設定 ---
        const zoneSize = 100;
        const leftZone = { x: 20, y: 50, width: zoneSize, height: zoneSize, color: "#e74c3c" };   
        const rightZone = { x: 800 - zoneSize - 20, y: 50, width: zoneSize, height: zoneSize, color: "#2ecc71" }; 

        const cat = new Cat(400, 450);
        let balls = [];

        function spawnBalls() {
            balls = [];
            for (let i = 0; i < BALL_COUNT; i++) {
                let rx = Math.random() * (canvas.width - 60) + 30;
                let ry = Math.random() * (canvas.height - 200) + 160; 
                balls.push(new Ball(i + 1, rx, ry));
            }
        }

        // --- 4. 核心邏輯 ---
        function handleAction() {
            let elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            if (!cat.holdingBall) {
                let closestBall = null; let minDist = REACH_DISTANCE;
                balls.forEach(ball => {
                    if (!ball.isHeld) {
                        let dist = Math.hypot(cat.x - ball.x, cat.y - ball.y);
                        if (dist < minDist) { minDist = dist; closestBall = ball; }
                    }
                });
                if (closestBall) {
                    cat.holdingBall = closestBall; closestBall.isHeld = true; playerData.pickupCount++;
                    playerData.actions.push({ time: elapsed, event: "PICKUP", ballId: closestBall.id });
                }
            } else {
                let droppedBall = cat.holdingBall; droppedBall.isHeld = false; cat.holdingBall = null;
                let inRightZone = (droppedBall.x >= rightZone.x && droppedBall.x <= rightZone.x + rightZone.width && droppedBall.y >= rightZone.y && droppedBall.y <= rightZone.y + rightZone.height);
                if (inRightZone) {
                    playerData.totalScore++;
                    droppedBall.x = Math.random() * (canvas.width - 60) + 30; droppedBall.y = Math.random() * (canvas.height - 200) + 160;
                    playerData.actions.push({ time: elapsed, event: "DROP_SCORE", ballId: droppedBall.id });
                } else {
                    playerData.actions.push({ time: elapsed, event: "DROP_GROUND", ballId: droppedBall.id });
                }
            }
        }

        // --- 5. 繪圖渲染 ---
        function draw() {
            let midX = canvas.width / 2;
            
            if (useImages) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#ebf5fb"; ctx.fillRect(0, 0, midX, canvas.height);
                ctx.fillStyle = "#e8f8f5"; ctx.fillRect(midX, 0, midX, canvas.height);
            }

            ctx.fillStyle = leftZone.color; ctx.fillRect(leftZone.x, leftZone.y, leftZone.width, leftZone.height);
            ctx.fillStyle = rightZone.color; ctx.fillRect(rightZone.x, rightZone.y, rightZone.width, rightZone.height);
            ctx.fillStyle = "#2c3e50"; ctx.font = "bold 16px sans-serif";
            ctx.fillText("裝飾區", leftZone.x, leftZone.y - 10); ctx.fillText("得分區", rightZone.x, rightZone.y - 10);
            ctx.fillStyle = "#27ae60"; ctx.font = "bold 24px sans-serif"; ctx.fillText(`得分: ${playerData.totalScore}`, rightZone.x - 110, rightZone.y + 60);

            let barW = 300, barH = 15, barX = (canvas.width - barW) / 2, barY = 25, ratio = timeLeft / GAME_DURATION;
            ctx.fillStyle = "#bdc3c7"; ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(barX, barY, barW * ratio, barH);
            ctx.fillStyle = "#34495e"; ctx.font = "14px sans-serif"; ctx.fillText(`剩餘時間: ${timeLeft} 秒`, canvas.width / 2 - 40, barY + barH + 18);

            balls.forEach(ball => ball.draw()); cat.draw();
        }

        function gameLoop() { if (isGameOver) return; cat.update(); draw(); requestAnimationFrame(gameLoop); }

        function startCountdown() {
            gameTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    timeLeft = 0; isGameOver = true; clearInterval(gameTimer);
                    document.getElementById("resId").innerText = pid;
                    document.getElementById("resScore").innerText = playerData.totalScore;
                    document.getElementById("resPickup").innerText = playerData.pickupCount;
                    document.getElementById("gameOverOverlay").style.display = "flex";
                    
                    // ⚙️ 核心調用：倒數一結束，立刻自動打包數據傳給 Google 表單
                    sendDataToGoogleForm();
                }
            }, 1000);
        }

        // --- 6. 📊 自動提交到 Google Form 核心邏輯 ---
        function generateTimelineString() {
            let log = "時間(秒)|動作|球體ID\n";
            playerData.actions.forEach(act => { log += `${act.time}|${act.event}|${act.ballId}\n`; });
            return log;
        }

        function sendDataToGoogleForm() {
            const statusDiv = document.getElementById("statusMessage");
            
            // 檢查玩家有沒有設定表單 URL
            if (GOOGLE_FORM_URL.includes("XXXXXXXXXXXXX")) {
                statusDiv.innerHTML = "⚠️ 提示：請在程式碼中配置您的 Google Form 欄位網址，以啟用雲端同步。";
                statusDiv.style.color = "#e67e22";
                return;
            }

            // 使用 FormData 打包網頁數據，格式完全模擬人類手動點選填寫表單
            const formData = new FormData();
            formData.append(ENTRY_PLAYER_ID, pid);
            formData.append(ENTRY_TOTAL_SCORE, playerData.totalScore);
            formData.append(ENTRY_PICKUP_COUNT, playerData.pickupCount);
            formData.append(ENTRY_TIMELINE, generateTimelineString());

            // 利用 fetch API 在背景將表單數據默默送出 (使用 no-cors 模式繞過跨網域安全性限制)
            fetch(GOOGLE_FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                statusDiv.innerHTML = "✅ 數據已完美自動同步至雲端試算表！";
                statusDiv.style.color = "#2ecc71";
            }).catch((error) => {
                console.error("上傳失敗：", error);
                statusDiv.innerHTML = "❌ 自動同步失敗，請點選下方按鈕手動下載 CSV 備份。";
                statusDiv.style.color = "#e74c3c";
            });
        }

        function initGame() { startTime = Date.now(); spawnBalls(); startCountdown(); requestAnimationFrame(gameLoop); }

        // --- 7. 事件監聽 ---
        window.addEventListener("keydown", (e) => {
            if (isGameOver) return;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
            if (e.key === " ") { if (!keys.Space) { keys.Space = true; handleAction(); } } 
            else if (e.key in keys) keys[e.key] = true;
        });
        window.addEventListener("keyup", (e) => { if (e.key === " ") keys.Space = false; else if (e.key in keys) keys[e.key] = false; });

        // 手動備份 CSV 機制
        document.getElementById("downloadBtn").addEventListener("click", () => {
            let csv = "\ufeff--- 總體摘要 ---\n指標項目,數據值\n";
            csv += `玩家ID,${pid}\n總得分,${playerData.totalScore}\n拿起球的次數,${playerData.pickupCount}\n\n`;
            csv += "--- 行為詳細時間序列 ---\n" + generateTimelineString().replace(/\|/g, ",");
            
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob); const link = document.createElement("a");
            link.setAttribute("href", url); link.setAttribute("download", `${pid}_行為數據.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        });

        window.onload = initGame;
    </script>
</body>
</html>
